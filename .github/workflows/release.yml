name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # GitHub attaches "Source code (zip)" and "(tar.gz)" to every release automatically.
      - name: Release
        run: >
          npx --yes
          -p semantic-release@24
          -p @semantic-release/changelog@6
          -p @semantic-release/git@10
          -p @semantic-release/github@10
          semantic-release
        env:
          # KEY_PAT is only needed when main is branch-protected. Falls back to the built-in token.
          GITHUB_TOKEN: ${{ secrets.KEY_PAT || secrets.GITHUB_TOKEN }}
